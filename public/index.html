<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibegeist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd3dc; font-family: ui-monospace, monospace; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; opacity: .85; z-index: 2; }
  #hud small { display: block; opacity: .6; margin-top: 2px; }
  canvas { display: block; }
  #pipBtn {
    position: fixed; top: 10px; right: 12px; z-index: 3;
    background: #1a1e27; color: #cfd3dc; border: 1px solid #333a47;
    border-radius: 6px; padding: 6px 10px; font: 12px ui-monospace, monospace;
    cursor: pointer;
  }
  #pipBtn:hover { background: #232936; }
</style>
</head>
<body>
<div id="hud">bağlanıyor...</div>
<button id="pipBtn" title="Her zaman üstte kalan küçük bir pencerede aç">📌 widget aç</button>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  const win = canvas.ownerDocument.defaultView || window;
  canvas.width = win.innerWidth;
  canvas.height = win.innerHeight;
}
resize();
addEventListener('resize', resize);

const hud = document.getElementById('hud');
const sessions = new Map(); // id -> {x,y,state,since,pulse,phase,stack}
let ghostsToday = 0;
let ghostsAllTime = 0;

function updateHud() {
  hud.innerHTML = `şu an <b>${sessions.size}</b> civciv çalışıyor<small>bugün ${ghostsToday} ruh yükseldi · toplam ${ghostsAllTime}</small>`;
}

function freshSession(x, y) {
  return {
    x, y, state: 'alive', since: Date.now(), phase: Math.random() * Math.PI * 2, stack: 0,
    climbed: 0, climbTarget: 0, lastPx: 0, lastPy: 0, reachedPeak: false,
  };
}

// --- background world: night sky, twinkling stars, and a mystical mountain everyone climbs ---
let stars = [];
function makeStars() {
  stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.8,
    r: Math.random() * 1.3 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
  }));
}
makeStars();
addEventListener('resize', makeStars);

// mountain geometry: a lane narrows from the base up to a single peak point.
// climbProgress 0..1 maps a session's lane fraction (its seeded x) and height to
// an (x,y) point on the slope - more tool calls this turn = higher up the mountain.
function mountainGeometry() {
  return {
    peakX: canvas.width / 2,
    peakY: canvas.height * 0.1,
    baseY: canvas.height - 6,
    baseLeftX: canvas.width * 0.06,
    baseRightX: canvas.width * 0.94,
  };
}
function pointOnMountain(laneFrac, progress) {
  const m = mountainGeometry();
  const leftX = m.baseLeftX + (m.peakX - m.baseLeftX) * progress;
  const rightX = m.baseRightX + (m.peakX - m.baseRightX) * progress;
  return {
    x: leftX + (rightX - leftX) * laneFrac,
    y: m.baseY + (m.peakY - m.baseY) * progress,
  };
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;

function connect() {
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      sessions.clear();
      for (const s of msg.active) sessions.set(s.id, freshSession(s.x, s.y));
      ghostsToday = msg.ghostsToday || 0;
      ghostsAllTime = msg.ghostsAllTime || 0;
    } else if (msg.type === 'join') {
      sessions.set(msg.id, freshSession(msg.x, msg.y));
    } else if (msg.type === 'activity') {
      const s = sessions.get(msg.id);
      if (s) {
        s.pulse = Date.now();
        s.stack = Math.min((s.stack || 0) + 1, 8);
        // every tool call climbs a little higher - bigger prompts reach higher up the mountain
        s.climbTarget = Math.min((s.climbTarget || 0) + 0.07, 1);
      }
    } else if (msg.type === 'ghost') {
      const s = sessions.get(msg.id);
      if (s) { s.state = 'ghost'; s.since = Date.now(); }
      ghostsToday = msg.ghostsToday ?? ghostsToday + 1;
      ghostsAllTime = msg.ghostsAllTime ?? ghostsAllTime + 1;
      setTimeout(() => sessions.delete(msg.id), 3000);
    } else if (msg.type === 'leave') {
      sessions.delete(msg.id);
    }
    updateHud();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

function draw() {
  const now = Date.now();
  const t = now / 1000;

  // night sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#0a0714');
  sky.addColorStop(1, '#151129');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // stars, gently twinkling
  for (const star of stars) {
    const a = 0.4 + 0.4 * Math.abs(Math.sin(t * 0.8 + star.twinkle));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cfd3dc';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // the mystical mountain everyone climbs
  const m = mountainGeometry();
  const rock = ctx.createLinearGradient(0, m.peakY, 0, m.baseY);
  rock.addColorStop(0, '#2a2350');
  rock.addColorStop(1, '#171233');
  ctx.fillStyle = rock;
  ctx.beginPath();
  ctx.moveTo(m.baseLeftX, m.baseY);
  ctx.lineTo(m.peakX, m.peakY);
  ctx.lineTo(m.baseRightX, m.baseY);
  ctx.closePath();
  ctx.fill();
  // a soft mystical glow at the peak
  const glow = ctx.createRadialGradient(m.peakX, m.peakY, 0, m.peakX, m.peakY, 90);
  glow.addColorStop(0, 'rgba(190,150,255,0.35)');
  glow.addColorStop(1, 'rgba(190,150,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(m.peakX, m.peakY, 90, 0, Math.PI * 2);
  ctx.fill();
  // snow cap
  ctx.fillStyle = 'rgba(230,225,245,0.9)';
  ctx.beginPath();
  ctx.moveTo(m.peakX, m.peakY);
  ctx.lineTo(m.peakX - 22, m.peakY + 34);
  ctx.lineTo(m.peakX + 22, m.peakY + 34);
  ctx.closePath();
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [, s] of sessions) {
    if (s.state === 'alive') {
      // ease the visible position toward the climb target so each tool call's progress
      // is a smooth step up the slope, not a teleport
      s.climbed += ((s.climbTarget || 0) - s.climbed) * 0.08;
      if (!s.reachedPeak && s.climbed > 0.97) {
        s.reachedPeak = true;
        s.peakReachedAt = now;
      }

      const base = pointOnMountain(s.x, s.climbed);
      // a little side-to-side wobble while climbing, on top of the lane position
      const speed = 1.3;
      const walkPhase = t * speed + s.phase;
      const wobble = Math.sin(walkPhase) * 10;
      const facingLeft = Math.cos(walkPhase) < 0;
      const px = base.x + wobble;
      const groundY = base.y;
      s.lastPx = px;
      s.lastPy = groundY;

      const pulseAge = s.pulse ? now - s.pulse : 9999;
      const bump = pulseAge < 400 ? 8 * (1 - pulseAge / 400) : 0;

      // fixed contact shadow
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(px, groundY + 12, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // stack of bricks growing beside it, one per tool call, most recent on top
      const stack = s.stack || 0;
      for (let i = 0; i < stack; i++) {
        const isTop = i === stack - 1;
        const topBump = isTop && pulseAge < 400 ? 4 * (1 - pulseAge / 400) : 0;
        ctx.font = `${14 + topBump}px sans-serif`;
        ctx.fillText('🧱', px + 26, groundY - 4 - i * 13 - topBump);
      }

      // a hand-drawn chick instead of a static emoji, so the legs can actually swing -
      // no emoji glyph has walk-cycle frames, which is why every emoji-based attempt
      // at "walking" kept reading as sliding, hopping, or swaying instead.
      const hue = Math.floor((s.phase / (Math.PI * 2)) * 360);
      const bodyColor = `hsl(${hue}, 75%, 68%)`;
      const beakColor = `hsl(${(hue + 30) % 360}, 90%, 55%)`;
      const legL = 8;
      const bodyR = 8 + bump * 0.3;

      ctx.save();
      ctx.translate(px, groundY);
      if (facingLeft) ctx.scale(-1, 1);

      // legs: two lines swinging in opposite phase - a real scissor gait, not a fake one
      ctx.strokeStyle = beakColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const legOffset of [0, Math.PI]) {
        const swing = Math.sin(walkPhase * 6 + legOffset) * 0.6;
        const hipY = -legL;
        const footX = Math.sin(swing) * legL;
        const footY = hipY + Math.cos(swing) * legL;
        ctx.beginPath();
        ctx.moveTo(0, hipY);
        ctx.lineTo(footX, footY);
        ctx.stroke();
      }

      const bodyCy = -legL - bodyR * 0.7;

      // wing on its back - a gentle idle flap all the time, plus an excited flurry
      // right after a tool call, so it visibly reacts to what it's doing
      const idleFlap = Math.sin(walkPhase * 3) * 0.15;
      const excitedFlap = pulseAge < 500 ? Math.sin(pulseAge * 0.05) * 0.7 * (1 - pulseAge / 500) : 0;
      ctx.save();
      ctx.translate(-bodyR * 0.55, bodyCy + bodyR * 0.1);
      ctx.rotate(-0.3 + idleFlap + excitedFlap);
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, bodyR * 0.6, bodyR * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // body
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(0, bodyCy, bodyR, bodyR * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();

      if (s.reachedPeak) {
        // reward for a big enough prompt to reach the summit: a little wizard hat,
        // fitting the mystical mountain, worn for the rest of this turn
        ctx.fillStyle = `hsl(${(hue + 200) % 360}, 60%, 55%)`;
        ctx.beginPath();
        ctx.moveTo(-bodyR * 0.5, bodyCy - bodyR * 0.9);
        ctx.lineTo(bodyR * 0.2, bodyCy - bodyR * 2.6);
        ctx.lineTo(bodyR * 0.55, bodyCy - bodyR * 0.85);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f5d76e';
        ctx.beginPath();
        ctx.arc(bodyR * 0.2, bodyCy - bodyR * 2.6, 1.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // fluffy head tuft - the default look, before reaching the summit
        ctx.strokeStyle = beakColor;
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-bodyR * 0.1, bodyCy - bodyR * 0.95);
        ctx.quadraticCurveTo(-bodyR * 0.45, bodyCy - bodyR * 1.5, bodyR * 0.05, bodyCy - bodyR * 1.15);
        ctx.stroke();
      }

      // beak, pointing the way it's facing
      ctx.fillStyle = beakColor;
      ctx.beginPath();
      ctx.moveTo(bodyR * 0.7, bodyCy - bodyR * 0.15);
      ctx.lineTo(bodyR * 0.7 + 5, bodyCy - bodyR * 0.3);
      ctx.lineTo(bodyR * 0.7 + 5, bodyCy);
      ctx.closePath();
      ctx.fill();

      // blush
      ctx.fillStyle = 'rgba(255,110,140,0.5)';
      ctx.beginPath();
      ctx.arc(bodyR * 0.4, bodyCy - bodyR * 0.05, bodyR * 0.22, 0, Math.PI * 2);
      ctx.fill();

      // eye - white, pupil, and a little highlight dot for actual expression
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bodyR * 0.3, bodyCy - bodyR * 0.45, bodyR * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#20140a';
      ctx.beginPath();
      ctx.arc(bodyR * 0.38, bodyCy - bodyR * 0.45, bodyR * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bodyR * 0.48, bodyCy - bodyR * 0.55, bodyR * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    } else {
      // upside-down, gently swaying as it drifts up and fades away - a spirit, not a jump.
      // Rises from wherever on the mountain it actually died, not a reset position.
      const age = now - s.since;
      const drift = Math.min(age / 3000, 1);
      const sway = Math.sin(t * 2 + s.phase) * 10;
      ctx.globalAlpha = 1 - drift;
      ctx.save();
      ctx.translate((s.lastPx || 0) + sway, (s.lastPy || 0) - drift * 70);
      ctx.rotate(Math.PI);
      ctx.font = '26px sans-serif';
      ctx.fillText('👻', 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(draw);
}
draw();

const pipBtn = document.getElementById('pipBtn');
pipBtn.addEventListener('click', async () => {
  if (!('documentPictureInPicture' in window)) {
    alert('Bu özellik Chrome veya Edge gerektiriyor.');
    return;
  }
  const pipWindow = await documentPictureInPicture.requestWindow({ width: 280, height: 220 });

  // the new window starts blank; carry over this page's styles
  for (const styleEl of document.querySelectorAll('style')) {
    pipWindow.document.head.append(styleEl.cloneNode(true));
  }

  pipWindow.document.body.append(hud);
  pipWindow.document.body.append(canvas);
  pipBtn.style.display = 'none';
  resize();
  pipWindow.addEventListener('resize', resize);

  pipWindow.addEventListener('pagehide', () => {
    document.body.append(hud);
    document.body.append(canvas);
    pipBtn.style.display = '';
    resize();
  });
});
</script>
</body>
</html>
