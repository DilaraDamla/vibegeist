<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibegeist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd3dc; font-family: ui-monospace, monospace; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; opacity: .85; z-index: 2; }
  #hud small { display: block; opacity: .6; margin-top: 2px; }
  canvas { display: block; }
  #pipBtn {
    position: fixed; top: 10px; right: 12px; z-index: 3;
    background: #1a1e27; color: #cfd3dc; border: 1px solid #333a47;
    border-radius: 6px; padding: 6px 10px; font: 12px ui-monospace, monospace;
    cursor: pointer;
  }
  #pipBtn:hover { background: #232936; }
</style>
</head>
<body>
<div id="hud">bağlanıyor...</div>
<button id="pipBtn" title="Her zaman üstte kalan küçük bir pencerede aç">📌 widget aç</button>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  const win = canvas.ownerDocument.defaultView || window;
  canvas.width = win.innerWidth;
  canvas.height = win.innerHeight;
}
resize();
addEventListener('resize', resize);

const hud = document.getElementById('hud');
const sessions = new Map(); // id -> {x,y,state,since,pulse,phase,stack}
let ghostsToday = 0;
let ghostsAllTime = 0;

function updateHud() {
  hud.innerHTML = `şu an <b>${sessions.size}</b> civciv çalışıyor<small>bugün ${ghostsToday} ruh yükseldi · toplam ${ghostsAllTime}</small>`;
}

function freshSession(x, y) {
  return { x, y, state: 'alive', since: Date.now(), phase: Math.random() * Math.PI * 2, stack: 0 };
}

// --- background world: sky, stars, ground, and a graveyard that fills up over time ---
const GRAVEYARD_H = 64;
let stars = [];
function makeStars() {
  const skyH = Math.max(0, canvas.height - GRAVEYARD_H);
  stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * skyH * 0.8,
    r: Math.random() * 1.3 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
  }));
}
makeStars();
addEventListener('resize', makeStars);

const TOMBSTONE_SIZE = 22;
let graveyardCount = 0;
function graveyardCols() {
  return Math.max(4, Math.floor((canvas.width - 20) / TOMBSTONE_SIZE));
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;

function connect() {
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      sessions.clear();
      for (const s of msg.active) sessions.set(s.id, freshSession(s.x, s.y));
      ghostsToday = msg.ghostsToday || 0;
      ghostsAllTime = msg.ghostsAllTime || 0;
    } else if (msg.type === 'join') {
      sessions.set(msg.id, freshSession(msg.x, msg.y));
    } else if (msg.type === 'activity') {
      const s = sessions.get(msg.id);
      if (s) { s.pulse = Date.now(); s.stack = Math.min((s.stack || 0) + 1, 8); }
    } else if (msg.type === 'ghost') {
      const s = sessions.get(msg.id);
      if (s) { s.state = 'ghost'; s.since = Date.now(); }
      ghostsToday = msg.ghostsToday ?? ghostsToday + 1;
      ghostsAllTime = msg.ghostsAllTime ?? ghostsAllTime + 1;
      setTimeout(() => {
        sessions.delete(msg.id);
        graveyardCount++;
      }, 3000);
    } else if (msg.type === 'leave') {
      sessions.delete(msg.id);
    }
    updateHud();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

function draw() {
  const now = Date.now();
  const t = now / 1000;
  const skyH = Math.max(0, canvas.height - GRAVEYARD_H);

  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, skyH);
  sky.addColorStop(0, '#0a0714');
  sky.addColorStop(1, '#151129');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, skyH);

  // stars, gently twinkling
  for (const star of stars) {
    const a = 0.4 + 0.4 * Math.abs(Math.sin(t * 0.8 + star.twinkle));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cfd3dc';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // a thin grass line where the field meets the graveyard
  ctx.fillStyle = '#1f3d2a';
  ctx.fillRect(0, skyH - 3, canvas.width, 3);

  // graveyard band
  ctx.fillStyle = '#171018';
  ctx.fillRect(0, skyH, canvas.width, GRAVEYARD_H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cols = graveyardCols();
  const rows = Math.max(1, Math.floor((GRAVEYARD_H - 8) / TOMBSTONE_SIZE));
  const maxTombstones = cols * rows;
  const shown = Math.min(graveyardCount, maxTombstones);
  ctx.font = `${TOMBSTONE_SIZE - 4}px sans-serif`;
  ctx.globalAlpha = 0.85;
  for (let i = 0; i < shown; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const gx = 14 + col * TOMBSTONE_SIZE;
    const gy = skyH + 16 + row * TOMBSTONE_SIZE;
    ctx.fillText('🪦', gx, gy);
  }
  ctx.globalAlpha = 1;

  for (const [, s] of sessions) {
    const homeX = 50 + s.x * (canvas.width - 100);
    const homeY = 40 + s.y * (skyH - 80);

    if (s.state === 'alive') {
      // pace back and forth on a fixed ground line - deliberately NO vertical motion at all.
      // Any up/down bob on a single static emoji (no leg-frame animation) reads as hopping/
      // jumping, not walking. The only thing that reads as "walking" here is a body that
      // rocks side to side (waddle) while it translates, pivoting near its feet.
      const speed = 1.3;
      const walkPhase = t * speed + s.phase;
      const wx = Math.sin(walkPhase) * 46;
      const facingLeft = Math.cos(walkPhase) < 0; // direction of travel
      const px = homeX + wx;
      const groundY = homeY;
      const waddle = Math.sin(walkPhase * 4) * 0.22;

      const pulseAge = s.pulse ? now - s.pulse : 9999;
      const bump = pulseAge < 400 ? 8 * (1 - pulseAge / 400) : 0;

      // fixed contact shadow on the ground line - no bob to tie it to anymore
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(px, groundY + 12, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // stack of bricks growing beside it, one per tool call, most recent on top
      const stack = s.stack || 0;
      for (let i = 0; i < stack; i++) {
        const isTop = i === stack - 1;
        const topBump = isTop && pulseAge < 400 ? 4 * (1 - pulseAge / 400) : 0;
        ctx.font = `${14 + topBump}px sans-serif`;
        ctx.fillText('🧱', homeX + 26, groundY - 4 - i * 13 - topBump);
      }

      const hue = Math.floor((s.phase / (Math.PI * 2)) * 360);
      const feetOffset = 13; // pivot the rock near the feet, not the belly, so it reads as rocking on its legs
      ctx.save();
      ctx.translate(px, groundY + feetOffset);
      ctx.rotate(waddle);
      if (facingLeft) ctx.scale(-1, 1);
      ctx.filter = `hue-rotate(${hue}deg) saturate(1.4)`;
      ctx.font = `${26 + bump}px sans-serif`;
      ctx.fillText('🐤', 0, -feetOffset);
      ctx.filter = 'none';
      ctx.restore();
    } else {
      const age = now - s.since;
      const drift = Math.min(age / 3000, 1);
      ctx.globalAlpha = 1 - drift;
      ctx.font = '26px sans-serif';
      ctx.fillText('👻', homeX, homeY - drift * 60);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(draw);
}
draw();

const pipBtn = document.getElementById('pipBtn');
pipBtn.addEventListener('click', async () => {
  if (!('documentPictureInPicture' in window)) {
    alert('Bu özellik Chrome veya Edge gerektiriyor.');
    return;
  }
  const pipWindow = await documentPictureInPicture.requestWindow({ width: 280, height: 220 });

  // the new window starts blank; carry over this page's styles
  for (const styleEl of document.querySelectorAll('style')) {
    pipWindow.document.head.append(styleEl.cloneNode(true));
  }

  pipWindow.document.body.append(hud);
  pipWindow.document.body.append(canvas);
  pipBtn.style.display = 'none';
  resize();
  pipWindow.addEventListener('resize', resize);

  pipWindow.addEventListener('pagehide', () => {
    document.body.append(hud);
    document.body.append(canvas);
    pipBtn.style.display = '';
    resize();
  });
});
</script>
</body>
</html>
