<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibegeist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd3dc; font-family: ui-monospace, monospace; overflow: hidden; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 2;
    font-size: clamp(10px, 2.6vw, 13px);
    background: rgba(10,8,18,0.55); backdrop-filter: blur(2px);
    padding: 5px 9px; border-radius: 6px; line-height: 1.35;
  }
  #hud small { display: block; opacity: .65; margin-top: 2px; }
  canvas { display: block; }
  #soundBtn, #pipBtn {
    position: fixed; top: 10px; z-index: 3;
    background: #1a1e27; color: #cfd3dc; border: 1px solid #333a47;
    border-radius: 6px; padding: 6px 10px; font: 12px ui-monospace, monospace;
    cursor: pointer;
  }
  #soundBtn:hover, #pipBtn:hover { background: #232936; }
  #soundBtn { right: 12px; }
  #pipBtn { right: 64px; }
  #race {
    position: fixed; top: 58px; left: 10px; z-index: 2; width: min(400px, calc(100vw - 20px));
    font-size: 11px; line-height: 1.3;
    background: rgba(10,8,18,0.55); backdrop-filter: blur(2px);
    padding: 6px 9px; border-radius: 6px; box-sizing: border-box;
  }
  #race .race-head { font-weight: 700; margin-bottom: 3px; }
  #race .room { opacity: .6; font-weight: 400; margin-left: 6px; }
  #race .race-empty { opacity: .6; }
  #race .race-row { display: grid; grid-template-columns: 16px 9px minmax(0,72px) 1fr 32px 118px; gap: 5px; align-items: center; padding: 1px 0; }
  #race .race-row.done .what { color: #ffd54a; font-weight: 700; }
  #race .rank { opacity: .6; }
  #race .dot { width: 9px; height: 9px; border-radius: 50%; }
  #race .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #race .bar { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; }
  #race .bar i { display: block; height: 100%; border-radius: 3px; transition: width .4s; }
  #race .pct { text-align: right; opacity: .8; }
  #race .what { opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #race .race-scores { margin-top: 4px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.1); opacity: .9; }
  #toast {
    position: fixed; left: 50%; top: 14px; z-index: 4; transform: translate(-50%, -30px);
    max-width: calc(100vw - 32px); box-sizing: border-box;
    background: rgba(20,12,36,0.9); border: 1px solid rgba(255,213,74,0.5); color: #fff;
    padding: 7px 14px; border-radius: 999px; font: 600 13px system-ui, sans-serif;
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #race .race-row { cursor: pointer; border-radius: 4px; }
  #race .race-row:hover { background: rgba(255,255,255,0.06); }
  #race .race-row.mine { background: rgba(255,213,74,0.12); }
  #race .who em { font-style: normal; opacity: .6; }
  #race .badges { font-size: 10px; }
  #me {
    position: fixed; left: 50%; bottom: 14px; z-index: 3; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; max-width: calc(100vw - 32px);
    font: 12px ui-monospace, monospace;
  }
  #me:empty { display: none; }
  #me .hint { background: rgba(10,8,18,0.6); padding: 5px 9px; border-radius: 6px; white-space: nowrap; }
  #me button, #me input {
    background: #1a1e27; color: #cfd3dc; border: 1px solid #333a47; border-radius: 6px;
    font: 16px system-ui, sans-serif; padding: 4px 8px; cursor: pointer;
  }
  #me button:hover { background: #232936; }
  #me form { display: flex; gap: 4px; }
  #me input { font: 12px ui-monospace, monospace; width: 110px; cursor: text; }
  #me form button { font: 12px ui-monospace, monospace; }
  /* the small widget window: the standings replace the headcount, no scoreboard */
  @media (max-height: 420px) {
    #hud, #pipBtn { display: none; }
    #race { top: 8px; left: 8px; width: min(330px, calc(100vw - 64px)); font-size: 10px; padding: 4px 7px; }
    #race .race-row { grid-template-columns: 14px 8px minmax(0,56px) 1fr 28px 92px; gap: 4px; }
    #race .race-scores, #race .race-empty { display: none; }
    #toast { top: auto; bottom: 46px; font-size: 11px; transform: translate(-50%, 30px); }
    #me { bottom: 8px; }
    #me .hint { font-size: 10px; }
    #me button { font-size: 13px; padding: 2px 6px; }
  }
</style>
</head>
<body>
<div id="hud">bağlanıyor...</div>
<div id="race"></div>
<div id="toast" role="status"></div>
<div id="me"></div>
<button id="soundBtn" title="Sesi aç">🔇</button>
<button id="pipBtn" title="Her zaman üstte kalan küçük bir pencerede aç">📌 widget aç</button>
<canvas id="c"></canvas>
<script type="module" src="js/main.js"></script>
</body>
</html>
