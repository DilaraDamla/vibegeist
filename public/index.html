<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibegeist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd3dc; font-family: ui-monospace, monospace; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; opacity: .85; z-index: 2; }
  #hud small { display: block; opacity: .6; margin-top: 2px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="hud">bağlanıyor...</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

const hud = document.getElementById('hud');
const sessions = new Map(); // id -> {x,y,state,since,pulse,phase,stack}
let ghostsToday = 0;

function updateHud() {
  hud.innerHTML = `şu an <b>${sessions.size}</b> civciv çalışıyor<small>bugün ${ghostsToday} ruh yükseldi</small>`;
}

function freshSession(x, y) {
  return { x, y, state: 'alive', since: Date.now(), phase: Math.random() * Math.PI * 2, stack: 0 };
}

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;

function connect() {
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      sessions.clear();
      for (const s of msg.active) sessions.set(s.id, freshSession(s.x, s.y));
      ghostsToday = msg.ghostsToday || 0;
    } else if (msg.type === 'join') {
      sessions.set(msg.id, freshSession(msg.x, msg.y));
    } else if (msg.type === 'activity') {
      const s = sessions.get(msg.id);
      if (s) { s.pulse = Date.now(); s.stack = Math.min((s.stack || 0) + 1, 8); }
    } else if (msg.type === 'ghost') {
      const s = sessions.get(msg.id);
      if (s) { s.state = 'ghost'; s.since = Date.now(); }
      ghostsToday = msg.ghostsToday ?? ghostsToday + 1;
      setTimeout(() => sessions.delete(msg.id), 3000);
    } else if (msg.type === 'leave') {
      sessions.delete(msg.id);
    }
    updateHud();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

function draw() {
  ctx.fillStyle = '#0b0d12';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const now = Date.now();
  const t = now / 1000;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [, s] of sessions) {
    const homeX = 50 + s.x * (canvas.width - 100);
    const homeY = 50 + s.y * (canvas.height - 100);

    if (s.state === 'alive') {
      // gentle wander around the home spot so it looks like it's pacing while it works
      const wx = Math.sin(t * 0.6 + s.phase) * 16;
      const wy = Math.cos(t * 0.4 + s.phase * 1.3) * 10;
      const px = homeX + wx;
      const py = homeY + wy;

      const pulseAge = s.pulse ? now - s.pulse : 9999;
      const bump = pulseAge < 400 ? 8 * (1 - pulseAge / 400) : 0;

      // stack of bricks growing beside it, one per tool call, most recent on top
      const stack = s.stack || 0;
      for (let i = 0; i < stack; i++) {
        const isTop = i === stack - 1;
        const topBump = isTop && pulseAge < 400 ? 4 * (1 - pulseAge / 400) : 0;
        ctx.font = `${14 + topBump}px sans-serif`;
        ctx.fillText('🧱', px + 20, py - 10 - i * 13 - topBump);
      }

      ctx.font = `${26 + bump}px sans-serif`;
      ctx.fillText('🐤', px, py);
    } else {
      const age = now - s.since;
      const drift = Math.min(age / 3000, 1);
      ctx.globalAlpha = 1 - drift;
      ctx.font = '26px sans-serif';
      ctx.fillText('👻', homeX, homeY - drift * 60);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
