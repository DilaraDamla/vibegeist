<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>vibegeist</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #cfd3dc; font-family: ui-monospace, monospace; overflow: hidden; }
  #hud { position: fixed; top: 12px; left: 12px; font-size: 13px; opacity: .85; z-index: 2; }
  #hud small { display: block; opacity: .6; margin-top: 2px; }
  canvas { display: block; }
  #pipBtn {
    position: fixed; top: 10px; right: 12px; z-index: 3;
    background: #1a1e27; color: #cfd3dc; border: 1px solid #333a47;
    border-radius: 6px; padding: 6px 10px; font: 12px ui-monospace, monospace;
    cursor: pointer;
  }
  #pipBtn:hover { background: #232936; }
</style>
</head>
<body>
<div id="hud">bağlanıyor...</div>
<button id="pipBtn" title="Her zaman üstte kalan küçük bir pencerede aç">📌 widget aç</button>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  const win = canvas.ownerDocument.defaultView || window;
  canvas.width = win.innerWidth;
  canvas.height = win.innerHeight;
}
resize();
addEventListener('resize', resize);

const hud = document.getElementById('hud');
const sessions = new Map(); // id -> {x,y,state,since,pulse,phase,stack}
let ghostsToday = 0;
let ghostsAllTime = 0;

function updateHud() {
  hud.innerHTML = `şu an <b>${sessions.size}</b> civciv çalışıyor<small>bugün ${ghostsToday} ruh yükseldi · toplam ${ghostsAllTime}</small>`;
}

function freshSession(x, y) {
  return {
    x, y, state: 'alive', since: Date.now(), phase: Math.random() * Math.PI * 2, stack: 0,
    climbed: 0, climbTarget: 0, lastPx: 0, lastPy: 0, reachedPeak: false,
  };
}

// --- background world: night sky, twinkling stars, and a mystical mountain everyone climbs ---
let stars = [];
function makeStars() {
  stars = Array.from({ length: 40 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height * 0.8,
    r: Math.random() * 1.3 + 0.3,
    twinkle: Math.random() * Math.PI * 2,
  }));
}
makeStars();
addEventListener('resize', makeStars);

// mountain geometry: a lane narrows from the base up to a single peak point.
// climbProgress 0..1 maps a session's lane fraction (its seeded x) and height to
// an (x,y) point on the slope - more tool calls this turn = higher up the mountain.
function mountainGeometry() {
  return {
    peakX: canvas.width / 2,
    peakY: canvas.height * 0.1,
    baseY: canvas.height - 6,
    baseLeftX: canvas.width * 0.06,
    baseRightX: canvas.width * 0.94,
  };
}
function pointOnMountain(laneFrac, progress) {
  const m = mountainGeometry();
  const leftX = m.baseLeftX + (m.peakX - m.baseLeftX) * progress;
  const rightX = m.baseRightX + (m.peakX - m.baseRightX) * progress;
  return {
    x: leftX + (rightX - leftX) * laneFrac,
    y: m.baseY + (m.peakY - m.baseY) * progress,
  };
}

// deterministic pseudo-random, so jagged terrain is stable frame to frame instead
// of crawling around, but still looks irregular rather than hand-placed
function hashRand(seed) {
  const x = Math.sin(seed * 127.1) * 43758.5453;
  return x - Math.floor(x);
}

// two faded, distant silhouettes behind the main peak - real mountain scenes read
// as layered ridges receding into haze, not one flat shape
let farRanges = [];
function makeFarRanges() {
  farRanges = [0.5, 0.4].map((heightFrac, layer) => {
    const baseY = canvas.height * (0.78 + layer * 0.05);
    const peakY = canvas.height * heightFrac;
    const points = [];
    const steps = 10;
    for (let i = 0; i <= steps; i++) {
      const p = i / steps;
      const x = p * canvas.width;
      const jitter = hashRand(layer * 97 + i);
      const y = baseY - (baseY - peakY) * Math.pow(Math.sin(p * Math.PI), 0.7) * (0.55 + jitter * 0.45);
      points.push({ x, y });
    }
    return { points, color: layer === 0 ? 'rgba(40,34,74,0.55)' : 'rgba(60,52,102,0.4)' };
  });
}
makeFarRanges();
addEventListener('resize', makeFarRanges);

// jagged silhouette for the main mountain's two slopes (rock, not a clean triangle),
// tapering to exact points at the base corners and the peak so the fill stays sealed
let mountainEdges = null;
function makeMountainEdges() {
  const m = mountainGeometry();
  const steps = 26;
  function side(fromX, seedBase) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const p = i / steps; // 0 at base corner, 1 at peak
      const x0 = fromX + (m.peakX - fromX) * p;
      const y0 = m.baseY + (m.peakY - m.baseY) * p;
      const taper = Math.sin(p * Math.PI);
      // two noise octaves - big rocky outcrops plus finer, sharper crags on top
      const coarse = (hashRand(seedBase + Math.floor(i / 3)) - 0.5) * 2;
      const fine = (hashRand(seedBase + 500 + i) - 0.5) * 2;
      const amp = 30 * taper;
      const jitter = coarse * 0.7 + fine * 0.3;
      pts.push({ x: x0 + jitter * amp, y: y0 - Math.abs(jitter) * amp * 0.3, p });
    }
    return pts;
  }
  mountainEdges = { left: side(m.baseLeftX, 1), right: side(m.baseRightX, 50) };
}
makeMountainEdges();
addEventListener('resize', makeMountainEdges);

// finds the point on a jagged edge at a given climb fraction, interpolating between
// the two nearest generated points
function edgePointAt(pts, targetP) {
  for (let i = 0; i < pts.length - 1; i++) {
    if (pts[i].p <= targetP && pts[i + 1].p >= targetP) {
      const span = pts[i + 1].p - pts[i].p || 1;
      const f = (targetP - pts[i].p) / span;
      return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * f, y: pts[i].y + (pts[i + 1].y - pts[i].y) * f };
    }
  }
  return pts[pts.length - 1];
}

// gently falling snow, drifting down with a light sideways sway - drawn last, in
// front of everything, since falling snow reads as the closest layer to the viewer
let snowflakes = [];
function makeSnowflakes() {
  snowflakes = Array.from({ length: 45 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.6 + 0.6,
    speed: Math.random() * 14 + 8,
    sway: Math.random() * Math.PI * 2,
    swaySpeed: Math.random() * 0.6 + 0.3,
  }));
}
makeSnowflakes();
addEventListener('resize', makeSnowflakes);

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
let ws;

function connect() {
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snapshot') {
      sessions.clear();
      for (const s of msg.active) sessions.set(s.id, freshSession(s.x, s.y));
      ghostsToday = msg.ghostsToday || 0;
      ghostsAllTime = msg.ghostsAllTime || 0;
    } else if (msg.type === 'join') {
      sessions.set(msg.id, freshSession(msg.x, msg.y));
    } else if (msg.type === 'activity') {
      const s = sessions.get(msg.id);
      if (s) {
        s.pulse = Date.now();
        // every tool call climbs a little higher - bigger prompts reach higher up the mountain
        s.climbTarget = Math.min((s.climbTarget || 0) + 0.07, 1);
      }
    } else if (msg.type === 'ghost') {
      const s = sessions.get(msg.id);
      if (s) { s.state = 'ghost'; s.since = Date.now(); }
      ghostsToday = msg.ghostsToday ?? ghostsToday + 1;
      ghostsAllTime = msg.ghostsAllTime ?? ghostsAllTime + 1;
      setTimeout(() => sessions.delete(msg.id), 3000);
    } else if (msg.type === 'leave') {
      sessions.delete(msg.id);
    }
    updateHud();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();

let lastFrameTs = Date.now();
function draw() {
  const now = Date.now();
  const dt = Math.min((now - lastFrameTs) / 1000, 0.1);
  lastFrameTs = now;
  const t = now / 1000;

  // night sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#0a0714');
  sky.addColorStop(1, '#151129');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // stars, gently twinkling
  for (const star of stars) {
    const a = 0.4 + 0.4 * Math.abs(Math.sin(t * 0.8 + star.twinkle));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cfd3dc';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // distant ridgelines behind the main peak, faded with atmospheric haze
  for (const range of farRanges) {
    ctx.fillStyle = range.color;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    ctx.lineTo(0, range.points[0].y);
    for (const pt of range.points) ctx.lineTo(pt.x, pt.y);
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fill();
  }

  // the mystical mountain everyone climbs, as a jagged rock silhouette
  const m = mountainGeometry();
  const rock = ctx.createLinearGradient(0, m.peakY, 0, m.baseY);
  rock.addColorStop(0, '#2a2350');
  rock.addColorStop(1, '#171233');
  ctx.fillStyle = rock;
  ctx.beginPath();
  ctx.moveTo(mountainEdges.left[0].x, mountainEdges.left[0].y);
  for (const pt of mountainEdges.left) ctx.lineTo(pt.x, pt.y);
  for (let i = mountainEdges.right.length - 1; i >= 0; i--) ctx.lineTo(mountainEdges.right[i].x, mountainEdges.right[i].y);
  ctx.closePath();
  ctx.fill();
  // a soft mystical glow at the peak
  const glow = ctx.createRadialGradient(m.peakX, m.peakY, 0, m.peakX, m.peakY, 90);
  glow.addColorStop(0, 'rgba(190,150,255,0.35)');
  glow.addColorStop(1, 'rgba(190,150,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(m.peakX, m.peakY, 90, 0, Math.PI * 2);
  ctx.fill();

  // snow cap: a real one only covers the upper slope, and its lower edge is a
  // wavy, irregular line - never a single flat cut across the mountain
  const snowStart = 0.8;
  const leftSnowPts = mountainEdges.left.filter((p) => p.p >= snowStart);
  const rightSnowPts = mountainEdges.right.filter((p) => p.p >= snowStart);
  const leftSnowBase = edgePointAt(mountainEdges.left, snowStart);
  const rightSnowBase = edgePointAt(mountainEdges.right, snowStart);
  const snowlineSteps = 5;
  const snowlinePts = [];
  for (let i = 1; i < snowlineSteps; i++) {
    const laneFrac = i / snowlineSteps;
    const wobble = (hashRand(300 + i) - 0.5) * 0.22;
    snowlinePts.push(pointOnMountain(laneFrac, snowStart + wobble));
  }
  const snowGrad = ctx.createLinearGradient(0, m.peakY, 0, leftSnowBase.y);
  snowGrad.addColorStop(0, 'rgba(255,255,255,0.95)');
  snowGrad.addColorStop(1, 'rgba(210,205,235,0.75)');
  ctx.fillStyle = snowGrad;
  ctx.beginPath();
  ctx.moveTo(leftSnowBase.x, leftSnowBase.y);
  for (const pt of leftSnowPts) ctx.lineTo(pt.x, pt.y);
  for (let i = rightSnowPts.length - 1; i >= 0; i--) ctx.lineTo(rightSnowPts[i].x, rightSnowPts[i].y);
  ctx.lineTo(rightSnowBase.x, rightSnowBase.y);
  for (let i = snowlinePts.length - 1; i >= 0; i--) ctx.lineTo(snowlinePts[i].x, snowlinePts[i].y);
  ctx.lineTo(leftSnowBase.x, leftSnowBase.y);
  ctx.closePath();
  ctx.fill();
  // shadowed crevices in the snow for a little texture - offset and unequal,
  // since two mirrored lines meeting at the peak read as an arrow, not rock
  ctx.strokeStyle = 'rgba(120,108,175,0.4)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(m.peakX - 14, m.peakY + 22);
  ctx.lineTo(m.peakX - 34, leftSnowBase.y - 10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(m.peakX + 22, m.peakY + 38);
  ctx.lineTo(m.peakX + 16, rightSnowBase.y - 4);
  ctx.stroke();
  // snow streaks trailing further down into the rock, like couloirs
  ctx.fillStyle = 'rgba(220,215,240,0.22)';
  [0.42, 0.58].forEach((laneFrac) => {
    const top = pointOnMountain(laneFrac, snowStart);
    const bottom = pointOnMountain(laneFrac, snowStart - 0.2);
    ctx.beginPath();
    ctx.moveTo(top.x - 5, top.y);
    ctx.lineTo(top.x + 5, top.y);
    ctx.lineTo(bottom.x + 1.5, bottom.y);
    ctx.lineTo(bottom.x - 1.5, bottom.y);
    ctx.closePath();
    ctx.fill();
  });

  // rocky facets for texture, so it reads as rock rather than a flat triangle -
  // offset away from the peak and from each other, since two facets both apexed
  // at the summit point read as an arrow, not rock shading
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.moveTo(m.peakX - 40, m.peakY + 60);
  ctx.lineTo(m.peakX - 115, m.baseY - 30);
  ctx.lineTo(m.peakX - 55, m.baseY - 30);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath();
  ctx.moveTo(m.peakX + 55, m.peakY + 75);
  ctx.lineTo(m.peakX + 135, m.baseY - 15);
  ctx.lineTo(m.peakX + 65, m.baseY - 15);
  ctx.closePath();
  ctx.fill();

  // a winding path up the slope
  ctx.strokeStyle = 'rgba(230,225,245,0.18)';
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(m.peakX, m.peakY + 30);
  const pathSteps = 5;
  for (let i = 1; i <= pathSteps; i++) {
    const p = i / pathSteps;
    const wiggle = Math.sin(p * 6) * 26 * p;
    const pt = pointOnMountain(0.5, 1 - p);
    ctx.lineTo(pt.x + wiggle, pt.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [, s] of sessions) {
    if (s.state === 'alive') {
      // ease the visible position toward the climb target so each tool call's progress
      // is a smooth step up the slope, not a teleport
      s.climbed += ((s.climbTarget || 0) - s.climbed) * 0.08;
      if (!s.reachedPeak && s.climbed > 0.97) {
        s.reachedPeak = true;
        s.peakReachedAt = now;
      }

      const base = pointOnMountain(s.x, s.climbed);
      // uphill direction at this point on the slope - the chick always faces and
      // leans into this, since it's pushing something up it, not wandering freely
      const ahead = pointOnMountain(s.x, Math.min(s.climbed + 0.05, 1));
      const upDx = ahead.x - base.x;
      const upDy = ahead.y - base.y;
      const upLen = Math.hypot(upDx, upDy) || 1;
      const dirX = upDx / upLen;
      const dirY = upDy / upLen;
      const facingLeft = dirX < 0;

      const speed = 0.6; // a real plodding climb, not a jitter
      const walkPhase = t * speed + s.phase;
      const wobble = Math.sin(walkPhase) * 3; // just a little life, not real wandering
      const px = base.x + wobble;
      const groundY = base.y;
      s.lastPx = px;
      s.lastPy = groundY;

      const pulseAge = s.pulse ? now - s.pulse : 9999;
      const bump = pulseAge < 400 ? 8 * (1 - pulseAge / 400) : 0;

      // fixed contact shadow
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(px, groundY + 12, 10, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // the orb it's pushing up the mountain, just uphill of it - a real Sisyphean boulder,
      // one per chick, that rolls (visibly rotating facets) as climb progress accumulates
      const orbDist = 20;
      const orbR = 7 + s.climbed * 5;
      const orbX = px + dirX * orbDist;
      const orbY = groundY + dirY * orbDist - orbR * 0.6;
      // offset from the chick's own hue below, so the boulder is always a visibly
      // different color from the chick pushing it, not a same-colored blob
      const hue0 = Math.floor(((s.phase / (Math.PI * 2)) * 360 + 150) % 360);
      ctx.save();
      ctx.translate(orbX, orbY);
      ctx.rotate(s.climbed * 22 + walkPhase);
      const orbGrad = ctx.createRadialGradient(-orbR * 0.3, -orbR * 0.3, 0, 0, 0, orbR);
      orbGrad.addColorStop(0, `hsl(${hue0}, 90%, 82%)`);
      orbGrad.addColorStop(1, `hsl(${hue0}, 70%, 45%)`);
      ctx.fillStyle = orbGrad;
      ctx.beginPath();
      ctx.arc(0, 0, orbR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-orbR, 0);
      ctx.lineTo(orbR, 0);
      ctx.moveTo(0, -orbR);
      ctx.lineTo(0, orbR);
      ctx.stroke();
      ctx.restore();
      // shadow under the orb
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(orbX, groundY + dirY * orbDist + 10, orbR * 0.8, orbR * 0.25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // a hand-drawn chick instead of a static emoji, so the legs can actually swing -
      // no emoji glyph has walk-cycle frames, which is why every emoji-based attempt
      // at "walking" kept reading as sliding, hopping, or swaying instead.
      const hue = Math.floor((s.phase / (Math.PI * 2)) * 360);
      const bodyColor = `hsl(${hue}, 75%, 68%)`;
      const beakColor = `hsl(${(hue + 30) % 360}, 90%, 55%)`;
      const legL = 8;
      const bodyR = 8 + bump * 0.3;

      ctx.save();
      ctx.translate(px, groundY);
      // lean forward into the push, before mirroring - defined in "facing right" space
      // so it always tips toward the orb no matter which way it's mirrored
      ctx.rotate(0.22);
      if (facingLeft) ctx.scale(-1, 1);

      // pushing arms reaching toward the orb it's rolling uphill
      ctx.strokeStyle = beakColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bodyR * 0.3, -legL - bodyR * 0.9);
      ctx.lineTo(bodyR * 1.6, -legL - bodyR * 1.1);
      ctx.stroke();

      // legs: two lines swinging in opposite phase - a real scissor gait, not a fake one
      ctx.strokeStyle = beakColor;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const legOffset of [0, Math.PI]) {
        const swing = Math.sin(walkPhase * 3 + legOffset) * 0.5;
        const hipY = -legL;
        const footX = Math.sin(swing) * legL;
        const footY = hipY + Math.cos(swing) * legL;
        ctx.beginPath();
        ctx.moveTo(0, hipY);
        ctx.lineTo(footX, footY);
        ctx.stroke();
      }

      const bodyCy = -legL - bodyR * 0.7;

      // wing on its back - a gentle idle flap all the time, plus an excited flurry
      // right after a tool call, so it visibly reacts to what it's doing
      const idleFlap = Math.sin(t * 2.4 + s.phase) * 0.15;
      const excitedFlap = pulseAge < 500 ? Math.sin(pulseAge * 0.05) * 0.7 * (1 - pulseAge / 500) : 0;
      ctx.save();
      ctx.translate(-bodyR * 0.55, bodyCy + bodyR * 0.1);
      ctx.rotate(-0.3 + idleFlap + excitedFlap);
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, bodyR * 0.6, bodyR * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // body
      ctx.fillStyle = bodyColor;
      ctx.beginPath();
      ctx.ellipse(0, bodyCy, bodyR, bodyR * 0.85, 0, 0, Math.PI * 2);
      ctx.fill();

      if (s.reachedPeak) {
        // reward for a big enough prompt to reach the summit: a little wizard hat,
        // fitting the mystical mountain, worn for the rest of this turn
        ctx.fillStyle = `hsl(${(hue + 200) % 360}, 60%, 55%)`;
        ctx.beginPath();
        ctx.moveTo(-bodyR * 0.5, bodyCy - bodyR * 0.9);
        ctx.lineTo(bodyR * 0.2, bodyCy - bodyR * 2.6);
        ctx.lineTo(bodyR * 0.55, bodyCy - bodyR * 0.85);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#f5d76e';
        ctx.beginPath();
        ctx.arc(bodyR * 0.2, bodyCy - bodyR * 2.6, 1.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // fluffy head tuft - the default look, before reaching the summit
        ctx.strokeStyle = beakColor;
        ctx.lineWidth = 1.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-bodyR * 0.1, bodyCy - bodyR * 0.95);
        ctx.quadraticCurveTo(-bodyR * 0.45, bodyCy - bodyR * 1.5, bodyR * 0.05, bodyCy - bodyR * 1.15);
        ctx.stroke();
      }

      // beak, pointing the way it's facing
      ctx.fillStyle = beakColor;
      ctx.beginPath();
      ctx.moveTo(bodyR * 0.7, bodyCy - bodyR * 0.15);
      ctx.lineTo(bodyR * 0.7 + 5, bodyCy - bodyR * 0.3);
      ctx.lineTo(bodyR * 0.7 + 5, bodyCy);
      ctx.closePath();
      ctx.fill();

      // blush
      ctx.fillStyle = 'rgba(255,110,140,0.5)';
      ctx.beginPath();
      ctx.arc(bodyR * 0.4, bodyCy - bodyR * 0.05, bodyR * 0.22, 0, Math.PI * 2);
      ctx.fill();

      // eye - white, pupil, and a little highlight dot for actual expression
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bodyR * 0.3, bodyCy - bodyR * 0.45, bodyR * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#20140a';
      ctx.beginPath();
      ctx.arc(bodyR * 0.38, bodyCy - bodyR * 0.45, bodyR * 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(bodyR * 0.48, bodyCy - bodyR * 0.55, bodyR * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    } else {
      // upside-down, gently swaying as it drifts up and fades away - a spirit, not a jump.
      // Rises from wherever on the mountain it actually died, not a reset position.
      const age = now - s.since;
      const drift = Math.min(age / 3000, 1);
      const sway = Math.sin(t * 2 + s.phase) * 10;
      ctx.globalAlpha = 1 - drift;
      ctx.save();
      ctx.translate((s.lastPx || 0) + sway, (s.lastPy || 0) - drift * 70);
      ctx.rotate(Math.PI);
      ctx.font = '26px sans-serif';
      ctx.fillText('👻', 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  // falling snow, drawn last so it sits in front of the whole scene
  ctx.fillStyle = '#fff';
  for (const f of snowflakes) {
    f.y += f.speed * dt;
    f.x += Math.sin(t * f.swaySpeed + f.sway) * 6 * dt;
    if (f.y > canvas.height + 4) {
      f.y = -4;
      f.x = Math.random() * canvas.width;
    }
    ctx.globalAlpha = 0.3 + 0.35 * Math.abs(Math.sin(t * 1.3 + f.sway));
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(draw);
}
draw();

const pipBtn = document.getElementById('pipBtn');
pipBtn.addEventListener('click', async () => {
  if (!('documentPictureInPicture' in window)) {
    alert('Bu özellik Chrome veya Edge gerektiriyor.');
    return;
  }
  const pipWindow = await documentPictureInPicture.requestWindow({ width: 280, height: 220 });

  // the new window starts blank; carry over this page's styles
  for (const styleEl of document.querySelectorAll('style')) {
    pipWindow.document.head.append(styleEl.cloneNode(true));
  }

  pipWindow.document.body.append(hud);
  pipWindow.document.body.append(canvas);
  pipBtn.style.display = 'none';
  resize();
  pipWindow.addEventListener('resize', resize);

  pipWindow.addEventListener('pagehide', () => {
    document.body.append(hud);
    document.body.append(canvas);
    pipBtn.style.display = '';
    resize();
  });
});
</script>
</body>
